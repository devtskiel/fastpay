services:
  - type: web
    name: swiftpay-merchant-gateway
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swiftpay-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: APP_SERVER_KEY
        sync: false
      - key: SWIFTPAY_PUBLIC_KEY
        sync: false
      - key: SWIFTPAY_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false # Set a secure random string in Render UI
      - key: MAGPIE_PUBLIC_KEY
        sync: false
      - key: MAGPIE_SECRET_KEY
        sync: false


databases:
  - name: swiftpay-db
    plan: free
